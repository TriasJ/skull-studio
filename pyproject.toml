[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skull-studio"
version = "0.1.0"
description = "Turn PDF/PPTX slide decks into interactive animated HTML (PixiJS + GSAP), with an in-browser editor, mesh/2D-bone rigging, and PPTX / video export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skull Studio contributors" }]
keywords = ["pdf", "pptx", "pixijs", "gsap", "animation", "slides", "presentation", "editor"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Operating System :: OS Independent",
]
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "jsonschema>=4.20",
    "python-pptx>=1.0",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
# Heavy OCR backend for recovering text baked into slide images. Best installed
# as an isolated tool so its torch/paddle deps don't collide with this project:
#   uv tool install "mineru[core]"
ocr = ["mineru[core]"]

[project.scripts]
skull-studio = "skull_studio.studio:main"

[project.urls]
Homepage = "https://github.com/TriasJ/skull-studio"
Issues = "https://github.com/TriasJ/skull-studio/issues"

[tool.setuptools]
packages = ["skull_studio"]
include-package-data = true

[tool.setuptools.package-data]
skull_studio = ["*.mjs"]
